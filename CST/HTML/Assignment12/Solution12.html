<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Course Registration</title>
</head>
<body>
    <form action="formtask.html" target="_blank">
        <h2>STUDENT INFORMATION</h2>
        <label for="name">Name:</label>
        <input type="text" id="name" required>
        <br>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" required>
        <br>
        <br>
        <label for="contact">Mobile Number:</label>
        <input type="number" id="contact" required maxlength="10" minlength="10">
        <br>
        <br>
        <input type="number" placeholder="Enter Alternate Phone Number" maxlength="10" minlength="10">
        <br>
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" required>
        <br>
        <br>
        <label for="pw">Password:</label>
        <input type="password" id="pw" required>
        <br>
        <br>
        <p>Gender:</p>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender">
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender">
        <br>
        <br>
        <p>Skills:</p>
        <label for="html">Html</label>
        <input type="checkbox" id="html" name="course">
        <label for="css">Css</label>
        <input type="checkbox" id="css" name="course">
        <label for="js">Java Script</label>
        <input type="checkbox" id="js" name="course">
        <label for="python">Python</label>
        <input type="checkbox" id="python" name="course">
        <br>
        <br>
        <label>Course:</label>
        <select required>
            <option>Web Development</option>
            <option>Python Programming</option>
            <option>Data Analytics</option>
            <option>Digital Marketing </option>
        </select>
        <input type="hidden" value="Online Course Registration">
        <br>
        <br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>
        <br>
        <br>
        <label for="pct">Preferred Class Time</label>
        <input type="time" id="pct" required>
        <br>
        <br>
        <label>Addition Information:</label>
        <textarea cols="20" rows="5" maxlength="110"></textarea>
        <br>
        <br>
        <label for="file">Document:</label>
        <input type="file" id="file">
        <br>
        <br>
        <input type="submit" value="SUBMIT">
        <br>
        <br>
        <input type="reset" value="RESET">
    </form>
</body>
</html>
