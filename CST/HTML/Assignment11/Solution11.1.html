<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Salary Slip</title>
</head>
<body>
    <table border="10" cellpadding="10">
        <tr>
            <th>Employee ID</th>
            <td>EMP101</td>
        </tr>
         <tr>
            <th>Employee Name</th>
            <td>Riya Sharma</td>
        </tr>
         <tr>
            <th>Department</th>
            <td>IT</td>
        </tr>
         <tr>
            <th>Designation</th>
            <td>Software Developer</td>
        </tr>
         <tr>
            <th>Month</th>
            <td>September 2026</td>
        </tr>
         <tr>
            <th rowspan="2">Salary Details</th>
            <td><table border="5" cellpadding="5">
                <tr>
                    <th>Earning</th>
                    <th>Amount</th>
                </tr>
                <tr>
                    <td>Basic Pay</td>
                    <td>30,000</td>
                </tr>
                <tr>
                    <td>HRA</td>
                    <td>6,000</td>
                </tr>
                <tr>
                    <td>DA</td>
                    <td>4,000</td>
                </tr>
                <tr>
                    <td>Total Earning</td>
                    <td>40,000</td>
                </tr>
            </table></td></tr>
            <tr><td><table border="5" cellpadding="5">
                <tr>
                    <th>Deduction</th>
                    <th>Amount</th>
                </tr>
                <tr>
                    <td>PF</td>
                    <td>2,000</td>
                </tr>
                <tr>
                    <td>Tax</td>
                    <td>1,500</td>
                </tr>
                <tr>
                    <td>Loan</td>
                    <td>1,000</td>
                </tr>
                <tr>
                    <td>Total Deduction</td>
                    <td>4,500</td>
                </tr>
            </table></td></tr>
            </td>
            <tr>
                <th>Net Salary</th>
                <td>35,500</td>
            </tr>
        </tr>
    </table>
</body>
</html>
